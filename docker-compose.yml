services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: crepro
      POSTGRES_PASSWORD: crepro
      POSTGRES_DB: crepro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crepro"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
