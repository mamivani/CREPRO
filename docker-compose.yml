# Local development stack (docs/plan/15-day-plan-solo.md Day 2).
#
# `docker compose up`            -> Postgres, Redis, all 11 services, one Dapr
#                                    sidecar per service (pubsub.redis against
#                                    the "redis" service below; see
#                                    dapr/components/pubsub.yaml for why this is
#                                    pubsub.redis and not Dapr's pubsub.in-memory).
# `docker compose --profile erp up` -> also brings up the external ERP
#                                    (vendored version v15.124.3, see README),
#                                    modeled on its own official frappe_docker
#                                    pwd.yml. Kept behind a profile: it is ~10
#                                    extra containers and is not needed for
#                                    Days 1-6 (Identity/Property work).

x-app-environment: &app-environment
  CREPRO_ENVIRONMENT: local
  CREPRO_DATABASE_URL: postgresql://crepro:crepro@postgres:5432/crepro
  CREPRO_REDIS_URL: redis://redis:6379/0

x-dapr-sidecar-image: &dapr-sidecar-image daprio/daprd:1.19.1

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: crepro
      POSTGRES_PASSWORD: crepro
      POSTGRES_DB: crepro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crepro"]
      interval: 5s
      retries: 10
    networks:
      - crepro

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks:
      - crepro

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    image: crepro/identity:local
    environment:
      <<: *app-environment
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crepro

  identity-dapr:
    image: *dapr-sidecar-image
    command:
      [
        "./daprd",
        "-app-id", "identity",
        "-app-port", "8001",
        "-dapr-http-port", "3500",
        "-dapr-grpc-port", "50001",
        "-resources-path", "/components",
        "-log-level", "warn",
      ]
    network_mode: "service:identity"
    volumes:
      - ./dapr/components:/components:ro
    depends_on:
      identity:
        condition: service_started
      redis:
        condition: service_healthy

  tenant:
