  # --- External ERP (profile: erp) ---------------------------------------
  # Modeled on frappe_docker's own pwd.yml (fetched from
  # github.com/frappe/frappe_docker, not vendored in this repo), pinned to the
  # exact version vendored in docs/architecture (v15.124.3) instead of that
  # file's own floating tag, and trimmed to install only the "erpnext" app
  # (docs/design/erp-adapter-hybrid.md S10: "payments" app is not used).
  erp-db:
    image: mariadb:11.8
    profiles: ["erp"]
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-snapshot-isolation=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${ERPNEXT_DB_ROOT_PASSWORD:-admin}
      MARIADB_ROOT_PASSWORD: ${ERPNEXT_DB_ROOT_PASSWORD:-admin}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - erp-db-data:/var/lib/mysql
    networks:
      - crepro

  erp-redis-cache:
    image: redis:6.2-alpine
    profiles: ["erp"]
    networks:
      - crepro

  erp-redis-queue:
    image: redis:6.2-alpine
    profiles: ["erp"]
    volumes:
      - erp-redis-queue-data:/data
    networks:
      - crepro

  erp-configurator:
    image: frappe/erpnext:v15.124.3
    profiles: ["erp"]
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host erp-db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache "redis://erp-redis-cache:6379";
        bench set-config -g redis_queue "redis://erp-redis-queue:6379";
        bench set-config -g redis_socketio "redis://erp-redis-queue:6379";
        bench set-config -gp socketio_port 9000;
    volumes:
      - erp-sites:/home/frappe/frappe-bench/sites
      - erp-logs:/home/frappe/frappe-bench/logs
    networks:
      - crepro

  erp-create-site:
    image: frappe/erpnext:v15.124.3
    profiles: ["erp"]
    entrypoint: ["bash", "-c"]
    command:
      - >
        wait-for-it -t 120 erp-db:3306;
        wait-for-it -t 120 erp-redis-cache:6379;
        wait-for-it -t 120 erp-redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        if [ -d "sites/frontend" ]; then
          echo "Site frontend already exists, skipping creation";
        else
          bench new-site --mariadb-user-host-login-scope='%' \
            --admin-password="${ERPNEXT_ADMIN_PASSWORD:-admin}" \
            --db-root-username=root \
            --db-root-password="${ERPNEXT_DB_ROOT_PASSWORD:-admin}" \
            --install-app erpnext \
            --set-default frontend;
        fi;
    depends_on:
      erp-configurator:
        condition: service_completed_successfully
    volumes:
      - erp-sites:/home/frappe/frappe-bench/sites
      - erp-logs:/home/frappe/frappe-bench/logs
    networks:
      - crepro

  erp-backend:
    image: frappe/erpnext:v15.124.3
    profiles: ["erp"]
    environment:
      DB_HOST: erp-db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ${ERPNEXT_DB_ROOT_PASSWORD:-admin}
      MARIADB_ROOT_PASSWORD: ${ERPNEXT_DB_ROOT_PASSWORD:-admin}
    depends_on:
      erp-create-site:
        condition: service_completed_successfully
    volumes:
      - erp-sites:/home/frappe/frappe-bench/sites
      - erp-logs:/home/frappe/frappe-bench/logs
    networks:
      - crepro

  erp-websocket:
    image: frappe/erpnext:v15.124.3
    profiles: ["erp"]
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment:
      FRAPPE_REDIS_CACHE: redis://erp-redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://erp-redis-queue:6379
    depends_on:
      erp-create-site:
        condition: service_completed_successfully
    volumes:
      - erp-sites:/home/frappe/frappe-bench/sites
      - erp-logs:/home/frappe/frappe-bench/logs
    networks:
      - crepro

  erp-frontend:
    image: frappe/erpnext:v15.124.3
    profiles: ["erp"]
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: erp-backend:8000
      FRAPPE_SITE_NAME_HEADER: frontend
      SOCKETIO: erp-websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    depends_on:
      - erp-websocket
      - erp-backend
    ports:
      - "8080:8080"
    volumes:
      - erp-sites:/home/frappe/frappe-bench/sites
      - erp-logs:/home/frappe/frappe-bench/logs
    networks:
      - crepro

  erp-queue-short:
    image: frappe/erpnext:v15.124.3
    profiles: ["erp"]
    command: ["bench", "worker", "--queue", "short,default"]
    environment:
      FRAPPE_REDIS_CACHE: redis://erp-redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://erp-redis-queue:6379
    depends_on:
      erp-configurator:
        condition: service_completed_successfully
    volumes:
      - erp-sites:/home/frappe/frappe-bench/sites
      - erp-logs:/home/frappe/frappe-bench/logs
    networks:
      - crepro

  erp-queue-long:
    image: frappe/erpnext:v15.124.3
    profiles: ["erp"]
    command: ["bench", "worker", "--queue", "long,default,short"]
    environment:
      FRAPPE_REDIS_CACHE: redis://erp-redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://erp-redis-queue:6379
    depends_on:
      erp-configurator:
        condition: service_completed_successfully
    volumes:
      - erp-sites:/home/frappe/frappe-bench/sites
      - erp-logs:/home/frappe/frappe-bench/logs
    networks:
      - crepro

  erp-scheduler:
    image: frappe/erpnext:v15.124.3
    profiles: ["erp"]
    command: ["bench", "schedule"]
    depends_on:
      erp-configurator:
        condition: service_completed_successfully
    volumes:
      - erp-sites:/home/frappe/frappe-bench/sites
      - erp-logs:/home/frappe/frappe-bench/logs
    networks:
      - crepro

volumes:
  erp-db-data:
  erp-redis-queue-data:
  erp-sites:
  erp-logs:

networks:
  crepro:
    driver: bridge
