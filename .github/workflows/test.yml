name: Test

on:
  push:
    branches: [main, develop]
  pull_request:

defaults:
  run:
    shell: bash

# All jobs run on self-hosted runners: see build.yml's top-of-file comment.
jobs:
  pytest:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: crepro-common
            path: packages/crepro-common
            package: crepro_common
          - name: identity
            path: services/identity
            package: crepro_identity
          - name: backend
            path: services/backend
            package: crepro_backend
          - name: erp_adapter
            path: services/erp_adapter
            package: crepro_erp_adapter
          - name: erp_reconciliation
            path: services/erp_reconciliation
            package: crepro_erp_reconciliation
          - name: erp_stub
            path: services/erp_stub
            package: crepro_erp_stub
    steps:
      - uses: actions/checkout@v7

      # Self-hosted runners share one global Python install, so concurrent
      # jobs pip-installing into it race (WinError 2 / "Could not restore").
      # Each job gets its own venv to avoid that.
      - name: Create isolated virtualenv
        run: |
          VENV="$RUNNER_TEMP/venv-$GITHUB_RUN_ID-$GITHUB_JOB-${{ matrix.target.name }}"
          python -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          echo "$VENV/Scripts" >> "$GITHUB_PATH"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/crepro-common[dev]
          # erp_reconciliation's real-client path depends on crepro-erp-adapter,
          # which (like crepro-common) is monorepo-local, not on PyPI (see
          # services/erp_reconciliation/Dockerfile): install it first so pip
          # can resolve that requirement.
          if [ "${{ matrix.target.path }}" == "services/erp_reconciliation" ]; then
            python -m pip install -e services/erp_adapter
          fi
          # backend mounts the domain routers, which are monorepo-local packages
          # (not on PyPI): install them first so its tests can import them.
          if [ "${{ matrix.target.path }}" == "services/backend" ]; then
            for svc in tenant property lease reservation payment document utility maintenance reporting; do
              python -m pip install -e "services/$svc"
            done
          fi
          if [ "${{ matrix.target.path }}" != "packages/crepro-common" ]; then
            python -m pip install -e "${{ matrix.target.path }}[dev]"
          fi

      # Coverage gate: 90% uniformly for now (meets the Domain Logic tier of
      # Vol 5 S18's table -- Domain 90% / APIs 80% / Utilities 90% / Critical
      # workflows 95% -- and every package already clears it). Day 9 splits
      # this by area as real business logic (not just CRUD) lands and the
      # tiers start to actually differ from each other.
      - name: Unit and integration tests (coverage >= 90%)
        run: |
          # The backend job also runs the nine domain suites (their routers are
          # mounted into the backend). Each suite runs in its own pytest process
          # because test module basenames repeat across services.
          targets="${{ matrix.target.path }}:${{ matrix.target.package }}"
          if [ "${{ matrix.target.path }}" == "services/backend" ]; then
            for svc in tenant property lease reservation payment document utility maintenance reporting; do
              targets="$targets services/$svc:crepro_$svc"
            done
          fi
          for target in $targets; do
            path="${target%%:*}"
            package="${target##*:}"
            python -m pytest "$path/tests" \
              --cov="$package" \
              --cov-report=term-missing \
              --cov-fail-under=90
          done

      # Contract tests against each service's OpenAPI schema land Day 9.
