name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          python -m pip install -e packages/crepro-common[dev]
          for svc in services/*/; do python -m pip install -e "$svc[dev]"; done

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test
        run: |
          python -m pytest packages/crepro-common/tests
          for svc in services/*/; do python -m pytest "$svc/tests"; done
