name: Build

on:
  push:
    branches: [main, develop]
  pull_request:

defaults:
  run:
    shell: bash

# Hosted-first, self-hosted-fallback (cost control), applied uniformly to
# every job: try the free GitHub-hosted minutes first; if that run fails for
# any reason -- including the account hitting its spending/payment limit,
# which was observed to block *every* GitHub-hosted job outright, not just
# parallel Docker builds -- a self-hosted fallback picks up the same work.
# Each task's un-suffixed job (`lint`, `build-images`) is the one required
# status check and the only thing anything else `needs:`; it passes as long
# as either path succeeded, so branch protection and downstream jobs don't
# care which one ran. It runs on self-hosted itself (not ubuntu-latest):
# when hosted is blocked, a hosted aggregator job would itself never start,
# so the one job everything depends on has to run somewhere guaranteed to
# work. For a matrix job (`build-images`), GitHub Actions doesn't expose
# per-entry results to a downstream job, so the aggregator is a single
# check for the whole matrix, and the self-hosted fallback re-runs every
# image, not just the ones that failed on the hosted side.
jobs:
  lint-hosted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          python -m pip install -e packages/crepro-common[dev]
          for svc in services/*/; do python -m pip install -e "$svc[dev]"; done

      - name: Lint and format check
        run: ruff check . && ruff format --check .

  lint-self-hosted:
    needs: lint-hosted
    if: always() && needs.lint-hosted.result == 'failure'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          python -m pip install -e packages/crepro-common[dev]
          for svc in services/*/; do python -m pip install -e "$svc[dev]"; done

      - name: Lint and format check
        run: ruff check . && ruff format --check .

  lint:
    needs: [lint-hosted, lint-self-hosted]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Require the hosted lint or its self-hosted fallback to have succeeded
        run: |
          if [ "${{ needs.lint-hosted.result }}" = "success" ]; then
            exit 0
          fi
          if [ "${{ needs.lint-self-hosted.result }}" = "success" ]; then
            exit 0
          fi
          echo "::error::Neither the GitHub-hosted lint run nor its self-hosted fallback succeeded."
          exit 1

  build-images-hosted:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: crepro-common
            dockerfile: packages/crepro-common/Dockerfile
          - name: identity
            dockerfile: services/identity/Dockerfile
          - name: tenant
            dockerfile: services/tenant/Dockerfile
          - name: property
            dockerfile: services/property/Dockerfile
          - name: lease
            dockerfile: services/lease/Dockerfile
          - name: reservation
            dockerfile: services/reservation/Dockerfile
          - name: payment
            dockerfile: services/payment/Dockerfile
          - name: document
            dockerfile: services/document/Dockerfile
          - name: utility
            dockerfile: services/utility/Dockerfile
          - name: maintenance
            dockerfile: services/maintenance/Dockerfile
          - name: reporting
            dockerfile: services/reporting/Dockerfile
          - name: erp_adapter
            dockerfile: services/erp_adapter/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build only, no push: Azure Container Registry doesn't exist until Day 3
      # (Terraform). Day 3+ adds login and push here once it does.
      - name: Build ${{ matrix.target.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.target.dockerfile }}
          push: false
          tags: crepro/${{ matrix.target.name }}:ci
          cache-from: type=gha,scope=${{ matrix.target.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.name }}

  build-images-self-hosted:
    needs: [lint, build-images-hosted]
    if: always() && needs.build-images-hosted.result == 'failure'
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: crepro-common
            dockerfile: packages/crepro-common/Dockerfile
          - name: identity
            dockerfile: services/identity/Dockerfile
          - name: tenant
            dockerfile: services/tenant/Dockerfile
          - name: property
            dockerfile: services/property/Dockerfile
          - name: lease
            dockerfile: services/lease/Dockerfile
          - name: reservation
            dockerfile: services/reservation/Dockerfile
          - name: payment
            dockerfile: services/payment/Dockerfile
          - name: document
            dockerfile: services/document/Dockerfile
          - name: utility
            dockerfile: services/utility/Dockerfile
          - name: maintenance
            dockerfile: services/maintenance/Dockerfile
          - name: reporting
            dockerfile: services/reporting/Dockerfile
          - name: erp_adapter
            dockerfile: services/erp_adapter/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.target.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.target.dockerfile }}
          push: false
          tags: crepro/${{ matrix.target.name }}:ci
          cache-from: type=gha,scope=${{ matrix.target.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.name }}

  build-images:
    needs: [build-images-hosted, build-images-self-hosted]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Require the hosted build or its self-hosted fallback to have succeeded
        run: |
          if [ "${{ needs.build-images-hosted.result }}" = "success" ]; then
            exit 0
          fi
          if [ "${{ needs.build-images-self-hosted.result }}" = "success" ]; then
            exit 0
          fi
          echo "::error::Neither the GitHub-hosted build-images run nor its self-hosted fallback succeeded."
          exit 1
