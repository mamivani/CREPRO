version: 2
updates:
  # Shared library and every service: all 12 Python packages in one block
  # using glob support for `directories` (Dependabot v2 schema).
  - package-ecosystem: "pip"
    directories:
      - "/packages/crepro-common"
      - "/services/*"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # Every service's Dockerfile plus crepro-common's, for base-image updates.
  - package-ecosystem: "docker"
    directories:
      - "/packages/crepro-common"
      - "/services/*"
    schedule:
      interval: "weekly"

  # docker-compose.yml lives at the repo root.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # The five CI/CD workflows themselves.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
