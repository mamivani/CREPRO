[project]
name = "crepro-lease"
version = "0.1.0"
description = "CREPRO lease service: lease lifecycle, rent schedules, renewals, and resident records"
requires-python = ">=3.12"
dependencies = [
    "crepro-common",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crepro_lease"]
