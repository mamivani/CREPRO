[project]
name = "crepro-erp-reconciliation"
version = "0.1.0"
description = "CREPRO ERP reconciliation job: identifies and fixes ERP sync discrepancies"
requires-python = ">=3.12"
dependencies = [
    "crepro-common",
    "crepro-erp-adapter",
    "httpx>=0.27",
    "dapr>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-cov>=5",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crepro_erp_reconciliation"]
