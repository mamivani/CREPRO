[project]
name = "crepro-document"
version = "0.1.0"
description = "CREPRO document service: lease and property documents, retention, and audit trail"
requires-python = ">=3.12"
dependencies = [
    "crepro-common",
    "uvicorn>=0.30",
    # DELIBERATE, TEMPORARY: seeding a known-critical CVE to verify Day 4's
    # container-scan merge gate (docs/plan/15-day-plan-solo.md). Not a real
    # dependency; this branch/PR will be closed without merging.
    "pillow==8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crepro_document"]
