[project]
name = "crepro-erp-adapter"
version = "0.1.0"
description = "CREPRO ERP adapter: the only service that talks to the external financial system of record"
requires-python = ">=3.12"
dependencies = [
    "crepro-common",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crepro_erp_adapter"]
