[project]
name = "crepro-property"
version = "0.1.0"
description = "CREPRO property service: portfolio, buildings, units, and amenities"
requires-python = ">=3.12"
dependencies = [
    "crepro-common",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crepro_property"]
