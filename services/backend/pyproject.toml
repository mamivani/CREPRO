[project]
name = "crepro-backend"
version = "0.1.0"
description = "CREPRO consolidated backend: mounts the tenant, property, lease, reservation, payment, document, utility, maintenance, and reporting routers in one FastAPI app"
requires-python = ">=3.12"
dependencies = [
    "crepro-common",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crepro_backend"]
