[project]
name = "crepro-erp-stub"
version = "0.1.0"
description = "CREPRO ERP stub: a minimal stand-in for the external ERP (ERPNext-shaped REST API), used for Dev/smoke-test environments where no real ERP instance is available"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crepro_erp_stub"]
