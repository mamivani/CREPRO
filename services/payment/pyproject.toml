[project]
name = "crepro-payment"
version = "0.1.0"
description = "CREPRO payment service: payment intents, processor webhooks, and receipts"
requires-python = ">=3.12"
dependencies = [
    "crepro-common",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crepro_payment"]
